<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>영업소장 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --navy-deep: #0e0c33;
    --navy: #12386b;
    --navy-text: #1b2340;
    --muted: #5b6478;
    --border: #d9e0ec;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, "Malgun Gothic", sans-serif;
    background: #ffffff;
    color: var(--navy-text);
  }

  body {
    display: flex;
    flex-direction: column;
  }

  .banner {
    flex: none;
    position: relative;
    overflow: hidden;
    height: clamp(110px, 9vw, 190px);
    background: var(--navy-deep) url("hero-pattern.jpg") center top/cover no-repeat;
    display: flex;
    align-items: center;
    padding: 0 clamp(24px, 4vw, 64px);
  }

  .banner img {
    height: clamp(24px, 2.2vw, 38px);
    width: auto;
    display: block;
    position: relative;
    z-index: 1;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .wrap {
    width: 100%;
    max-width: min(88vw, 2000px);
    margin: 0 auto;
    padding: clamp(28px, 4vh, 72px) 0 clamp(48px, 6vw, 96px);
  }

  .eyebrow-icon {
    width: clamp(40px, 3vw, 52px);
    height: clamp(40px, 3vw, 52px);
    border-radius: 11px;
    background: var(--navy);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  h1 {
    font-size: clamp(30px, 3.4vw, 58px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    color: var(--navy-text);
  }

  .subtitle {
    color: var(--muted);
    font-size: clamp(14px, 1.2vw, 20px);
    margin: 0 0 clamp(32px, 4.5vw, 64px);
  }

  .status {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }

  .status.error {
    color: #b94b54;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: clamp(20px, 2.6vw, 48px);
  }

  .platform-card {
    position: relative;
    display: block;
    text-decoration: none;
    color: var(--navy-text);
    transition: transform 160ms ease;
  }

  .platform-card:hover {
    transform: translateY(-4px);
  }

  .platform-card:focus-visible {
    outline: 3px solid var(--badge-color, var(--navy));
    outline-offset: 4px;
    border-radius: 18px;
  }

  .card-inner {
    container-type: inline-size;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 18px;
    border: 1.5px solid var(--border);
    box-shadow: 0 4px 14px rgba(18, 56, 107, 0.07);
    transition: box-shadow 160ms ease, border-color 160ms ease;
  }

  .platform-card:hover .card-inner {
    box-shadow: 0 16px 32px rgba(18, 56, 107, 0.16);
    border-color: var(--navy);
  }

  .type-badge {
    position: absolute;
    top: -12px;
    left: 24px;
    z-index: 2;
    background: #ffffff;
    color: var(--badge-color, var(--navy));
    font-size: 12px;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--badge-color, var(--border));
    box-shadow: 0 2px 6px rgba(18, 56, 107, 0.12);
  }

  .card-head {
    background: var(--badge-color, var(--navy));
    padding: clamp(36px, 3vw, 48px) clamp(26px, 2vw, 34px) clamp(26px, 1.6vw, 32px);
    display: flex;
    align-items: center;
    gap: clamp(18px, 1.4vw, 24px);
  }

  .icon-badge {
    flex: none;
    width: clamp(54px, 4vw, 68px);
    height: clamp(54px, 4vw, 68px);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-badge svg {
    width: clamp(24px, 1.8vw, 30px);
    height: clamp(24px, 1.8vw, 30px);
  }

  .platform-title {
    color: #ffffff;
    /* 카드 폭 기준: 가장 긴 제목(약 10자)이 아이콘 옆 한 줄에 들어가도록 */
    font-size: clamp(18px, calc((100cqi - 150px) / 8.8), 32px);
    white-space: nowrap;
    word-break: keep-all;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.32;
  }

  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    padding: clamp(28px, 2.2vw, 38px) clamp(26px, 2vw, 34px) clamp(26px, 2vw, 34px);
  }

  .internal-notice {
    position: absolute;
    top: -12px;
    right: 24px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 4px;
    background: #ffffff;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    box-shadow: 0 2px 6px rgba(18, 56, 107, 0.12);
  }

  .platform-desc {
    color: var(--navy-text);
    /* 카드 폭 기준: 시트에서 나눈 한 줄(약 20자)이 줄바꿈 없이 들어가도록 */
    font-size: clamp(14px, calc((100cqi - 72px) / 16.5), 22px);
    word-break: keep-all;
    line-height: 1.6;
    text-align: center;
    flex: 1;
    margin-bottom: clamp(26px, 2vw, 34px);
  }

  .platform-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--badge-color, var(--navy));
    color: #ffffff;
    font-size: clamp(15px, 1vw, 18px);
    font-weight: 700;
    padding: clamp(14px, 1vw, 18px);
    border-radius: 10px;
    transition: filter 160ms ease;
  }

  .platform-cta svg {
    transition: transform 160ms ease;
  }

  .platform-card:hover .platform-cta {
    filter: brightness(0.88);
  }

  .platform-card:hover .platform-cta svg {
    transform: translateX(3px);
  }

  .skeleton-card {
    height: 220px;
    border-radius: 18px;
    background: linear-gradient(90deg, #eef1f6 25%, #f6f8fb 37%, #eef1f6 63%);
    background-size: 400% 100%;
    animation: skeleton-pulse 1.4s ease infinite;
  }

  @keyframes skeleton-pulse {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }
</style>
</head>
<body>
  <div class="banner">
    <img src="logo_white.png" alt="INNODEP">
  </div>

  <main>
    <div class="wrap">
      <div class="eyebrow-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect width="7" height="7" x="3" y="3" rx="1.5"/>
          <rect width="7" height="7" x="14" y="3" rx="1.5"/>
          <rect width="7" height="7" x="14" y="14" rx="1.5"/>
          <rect width="7" height="7" x="3" y="14" rx="1.5"/>
        </svg>
      </div>
      <h1>영업소장 대시보드</h1>
      <p class="subtitle">조달 시장, 입찰 공고, 인증 현황을 한곳에서 확인합니다.</p>

      <div id="status" class="status" style="display:none;"></div>
      <div id="grid" class="grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

<script>
  const SHEET_ID = "14Hf32sz3B6EhnXAZjd4d0j25gc3TCLltAhTuGh5BzhI";  // 영업소장 대시보드 전용 시트 (영업관리 시트와 분리)
  const GID = "0";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

  const TYPE_MAP = {
    "조달시장 대시보드": { badge: "시장", icon: "triangle", color: "#1e5fb0", internal: false },
    "공고검색 시스템": { badge: "공고", icon: "search", color: "#0a7a86", internal: true },
    "고객정도관리시스템": { badge: "고객", icon: "users", color: "#4a5fd1", internal: true },
    "고객정보관리시스템": { badge: "고객", icon: "users", color: "#4a5fd1", internal: true },
    "인증서 검색": { badge: "인증", icon: "badge-check", color: "#c2552f", internal: true },
    "인센티브 관리": { badge: "인센티브", icon: "banknote", color: "#2f8a4c", internal: true },
  };

  const ICONS = {
    "search": '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    "trending-up": '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
    "triangle": '<path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>',
    "bar-chart": '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
    "badge-check": '<path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/>',
    "users": '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    "banknote": '<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
    "folder": '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
    "arrow-right": '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    "lock": '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  };

  function iconSvg(name, size = 24) {
    const paths = ICONS[name] || ICONS["folder"];
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
  }

  function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field); field = "";
      } else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        rows.push(row); row = [];
      } else {
        field += c;
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ""));
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));
  }

  function descHtml(s) {
    return escapeHtml(s).replace(/\n/g, "<br>");
  }

  async function loadLinks() {
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    try {
      const resp = await fetch(CSV_URL, { cache: "no-store" });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      const rows = parseCsv(text);
      if (rows.length < 2) throw new Error("데이터가 없습니다");

      const headers = rows[0].map(h => h.trim());
      const titleIdx = headers.findIndex(h => h === "구분");
      const descIdx = headers.findIndex(h => h === "설명");
      const urlIdx = headers.findIndex(h => h.toLowerCase() === "url");
      if (titleIdx === -1 || urlIdx === -1) {
        throw new Error("시트에는 `구분`과 `url` 컬럼이 필요합니다");
      }

      const links = rows.slice(1)
        .map(r => ({
          title: (r[titleIdx] || "").trim(),
          desc: descIdx >= 0 ? (r[descIdx] || "").trim() : "",
          url: (r[urlIdx] || "").trim(),
        }))
        .filter(l => l.title && l.url);

      if (links.length === 0) {
        statusEl.style.display = "block";
        statusEl.textContent = "표시할 링크가 없습니다. Google Sheets에 `구분`, `url` 값을 추가해주세요.";
        return;
      }

      const cardsHtml = links.map(l => {
        const meta = TYPE_MAP[l.title] || { badge: "", icon: "folder", color: "#12386b", internal: false };
        return `
        <a class="platform-card" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer" style="--badge-color:${meta.color}">
          ${meta.badge ? `<div class="type-badge">${escapeHtml(meta.badge)}</div>` : ""}
          ${meta.internal ? `<div class="internal-notice">${iconSvg("lock", 12)} 사내망 전용</div>` : ""}
          <div class="card-inner">
            <div class="card-head">
              <div class="icon-badge">${iconSvg(meta.icon)}</div>
              <div class="platform-title">${escapeHtml(l.title)}</div>
            </div>
            <div class="card-body">
              <div class="platform-desc">${descHtml(l.desc)}</div>
              <div class="platform-cta">바로가기 ${iconSvg("arrow-right", 16)}</div>
            </div>
          </div>
        </a>
      `;
      }).join("");

      gridEl.innerHTML = cardsHtml;
    } catch (err) {
      statusEl.style.display = "block";
      statusEl.textContent = `링크 시트를 불러오지 못했습니다: ${err.message}`;
      statusEl.classList.add("error");
    }
  }

  loadLinks();
</script>
</body>
</html>
